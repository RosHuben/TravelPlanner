<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner Premium V2</title>

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body>

<header>

    <h1>✈️ Travel Planner Premium</h1>

    <p>Your family's travel story</p>

</header>

<div class="container">

    <section class="stats">

        <div class="stat">

            <div
                id="tripCount"
                class="number">
                -
            </div>

            <div class="label">
                Trips
            </div>

        </div>

        <div class="stat">

            <div
                id="travelDays"
                class="number">
                -
            </div>

            <div class="label">
                Travel Days
            </div>

        </div>

        <div class="stat">

            <div
                id="countryCount"
                class="number">
                -
            </div>

            <div class="label">
                Countries
            </div>

        </div>

        <div class="stat">

            <div
                id="continentCount"
                class="number">
                -
            </div>

            <div class="label">
                Continents
            </div>

        </div>

    </section>

    <div class="grid">

        <div class="card">

            <h2>🗓 Year Wheel</h2>

            <canvas
                id="wheel"
                width="600"
                height="600">
            </canvas>

        </div>

        <div class="card">

            <h2>📍 Travel Timeline</h2>

            <div id="timeline">

            </div>

        </div>

        <div class="card">

            <h2>🌍 World Map</h2>

            <div id="map"></div>

        </div>

        <div class="card">

            <h2>📈 Travel Insights</h2>

            <div id="insights">

            </div>

        </div>

    </div>

    <footer>

        Travel Planner Premium V2

    </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="app.js"></script>

</body>
</html>
